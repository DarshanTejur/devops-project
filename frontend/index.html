<!DOCTYPE html>
<html>
<head>
    <title>DevOps Project</title>
</head>
<body>
    <h1>Full-Stack App Status:</h1>
    <div id="status">Connecting to Backend...</div>

    <script>
        fetch('/api')
            .then(res => res.json())
            .then(data => document.getElementById('status').innerText = data.message)
            .catch(err => document.getElementById('status').innerText = "Backend Unreachable");
    </script>
</body>
</html>
