<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --primary: #38bdf8;
            --accent: #22c55e;
        }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px;
        }
        #root { width: 100%; max-width: 800px; }
        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
            margin-bottom: 24px;
            border: 1px solid #334155;
        }
        input { 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: white; 
            padding: 12px; 
            border-radius: 6px; 
            width: 70%; 
            margin-right: 10px;
        }
        button { 
            background: var(--primary); 
            color: #0f172a; 
            font-weight: 600; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .task-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px; 
            border-bottom: 1px solid #334155;
        }
        .status-dot { height: 10px; width: 10px; background-color: var(--accent); border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
