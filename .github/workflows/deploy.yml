name: Local CI Baseline
on:
  push:
    branches: [ main, feature/verify-ci-pipeline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # This adds a manual "Run" button!

jobs:
  build-test:
    name: Build and Verify Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Local Images
        run: |
          docker-compose build
          
      - name: Verify Service Health
        run: |
          docker-compose up -d
          sleep 10
          # We use the internal container name or localhost
          curl -f http://localhost:3000/api || exit 1
          echo "Local CI Check Passed!"