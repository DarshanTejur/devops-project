name: Local CI Baseline
on:
  push:
    branches: 
      - main
      - feature/local-stabilization
      - local-phase1-stable  # This ensures Phase 1 is always verified
  pull_request:
    branches:
      - main
  workflow_dispatch: # Keeps the manual "Run" button active

jobs:
  build-test:
    name: Build and Verify Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Local Images
        run: |
          # Uses the modern Docker CLI
          docker compose build
          
      - name: Verify Service Health
        run: |
          docker compose up -d
          sleep 15
          # Final verification check
          curl -f http://localhost:3000/api || exit 1
          echo "Local CI Check Passed!"