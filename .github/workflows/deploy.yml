name: AWS Cloud Deploy
on:
  push:
    branches: [ feature/aws-cloud-deploy ] # Only trigger here for now
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the project folder (Update this path if needed)
            cd ~/devops-project || mkdir -p ~/devops-project && cd ~/devops-project
            
            # 2. Pull the latest changes from the branch
            # Note: You might need to set up a Personal Access Token on EC2 if the repo is private
            git pull origin feature/aws-cloud-deploy
            
            # 3. Build and Restart the containers on the server
            sudo docker compose down
            sudo docker compose up -d --build
            
            # 4. Cleanup old Docker images to save space on EC2
            sudo docker image prune -f