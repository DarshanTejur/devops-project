name: Local CI Baseline
on:
  push:
    branches: [ main, feature/verify-ci-pipeline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger it manually via the Actions tab

jobs:
  build-test:
    name: Build and Verify Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: List files for debugging
        run: ls -R

      - name: Build Local Images
        run: |
          # Modern Docker CLI uses 'compose' without the hyphen
          docker compose build
          
      - name: Verify Service Health
        run: |
          # Start containers in detached mode
          docker compose up -d
          # Give services time to initialize
          sleep 15
          # Test the backend API health
          curl -f http://localhost:3000/api || exit 1
          echo "Local CI Check Passed: Phase 1 Complete!"