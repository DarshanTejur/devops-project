name: Local CI Baseline
on:
  push:
    branches: [ main, feature/verify-ci-pipeline ] # Add your branch here!
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build and Verify Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Local Images
        run: |
          # This simulates exactly what happens on your MacBook
          # If there is a syntax error in server.js or App.js, this step will FAIL.
          docker-compose build
          
      - name: Verify Service Health
        run: |
          # Start the containers in the CI environment
          docker-compose up -d
          # Give them 10 seconds to wake up
          sleep 10
          # Check if the backend is actually responding
          curl -f http://localhost:3000/api || exit 1
          echo "Local CI Check Passed: Services are healthy!"